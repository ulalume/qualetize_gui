name: Pages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release to attach the web build to (e.g. v0.6.0); empty for none"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  WASI_SDK_VERSION: "34.0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasi-sdk
        run: |
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" >> "$GITHUB_ENV"

      - name: Install wasm-bindgen-cli
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{f=1;next} f&&/^version = /{gsub(/"/,"",$3);print $3;exit}' Cargo.lock)
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version | awk '{print $2}')" != "$version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi

      # A pinned binaryen release: the distribution package is too old for
      # the reference-types table wasm-bindgen emits.
      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
        env:
          BINARYEN_VERSION: "123"

      - name: Build web
        run: scripts/build-web.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      # The same files as a zip with index.html at its root, the layout
      # static hosts such as itch.io expect.
      - name: Create web archive
        id: web_archive
        run: |
          name="qualetize-gui-${WEB_VERSION}-web.zip"
          (cd web/dist && zip -r "$GITHUB_WORKSPACE/$name" .)
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          WEB_VERSION: ${{ inputs.release_tag || github.ref_name }}

      - name: Upload web archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.web_archive.outputs.name }}
          path: ${{ steps.web_archive.outputs.name }}

      - name: Attach web archive to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ steps.web_archive.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
