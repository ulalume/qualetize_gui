<body>
  <div id="loading">Loading…</div>
  <canvas id="the_canvas_id"></canvas>
  <script>
    window.addEventListener("error", (e) => console.log("uncaught:", e.message, e.error && e.error.stack));
    window.addEventListener("unhandledrejection", (e) => console.log("unhandled rejection:", String(e.reason)));
  </script>
  <script type="module">
    import init, { start } from "./qualetize_gui.js";
    await init();
    await start(document.getElementById("the_canvas_id"));
    document.getElementById("loading").remove();
  </script>
