<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qualetize GUI</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ccc; font: 14px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <canvas id="the_canvas_id"></canvas>
  <script>
    window.addEventListener("error", (e) => console.log("uncaught:", e.message, e.error && e.error.stack));
    window.addEventListener("unhandledrejection", (e) => console.log("unhandled rejection:", String(e.reason)));
  </script>
  <script type="module">
    import init, { start } from "./qualetize_gui.js";
    await init();
    await start(document.getElementById("the_canvas_id"));
    document.getElementById("loading").remove();
  </script>
</body>
</html>
