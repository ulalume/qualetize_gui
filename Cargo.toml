[package]
name = "qualetize_gui"
version = "0.6.2"
edition = "2024"
build = "build.rs"

[lib]
name = "qualetize_gui"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "QualetizeGUI"
path = "src/main.rs"

[package.metadata.bundle]
name = "QualetizeGUI"
identifier = "io.github.ulalume.qualetize_gui"
icon = ["assets/icon.icns"]

[dependencies]
egui = "0.35"
image = "0.25"
moxcms = "0.8"
log = "0.4"
miniz_oxide = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.18"
regex = "1.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.35"
env_logger = "0.11"
rfd = "0.17"
dirs = "6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# glow (WebGL) instead of wgpu: 5 MB smaller and works without WebGPU.
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "web_screen_reader"] }
console_log = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rfd = "0.17"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "DedicatedWorkerGlobalScope",
    "Window",
    "Location",
    "UrlSearchParams",
    "Response",
    "Storage",
    "Document",
    "HtmlElement",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
web-time = "1.1"
postcard = { version = "1", features = ["alloc"] }

[build-dependencies]
cc = "1.4"

[profile.dev]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
