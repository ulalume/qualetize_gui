[package]
name = "qualetize_gui"
version = "0.5.1"
edition = "2024"
build = "build.rs"

[lib]
name = "qualetize_gui"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "QualetizeGUI"
path = "src/main.rs"

[package.metadata.bundle]
name = "QualetizeGUI"
identifier = "io.github.ulalume.qualetize_gui"
icon = ["assets/icon.icns"]

[dependencies]
eframe = "0.35"
egui = "0.35"
image = "0.25"
moxcms = "0.8"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.18"
regex = "1.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
dirs = "6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
web-time = "1.1"

[build-dependencies]
cc = "1.4"

[profile.dev]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
